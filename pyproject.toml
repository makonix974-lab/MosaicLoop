[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "guitarmulticam"
version = "0.2.0"
description = "Multi-cam audio sync + grid composer for musical performances"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Marc", email = "marc@powerfull.local"},
]

dependencies = [
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.scripts]
guitarcam = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src/*", "cli/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
